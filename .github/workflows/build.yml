name: Build Android APK
on:
  push:
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.*"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  build-android:
    name: Build Android only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK tools
        run: |
          mkdir -p "$HOME/cmake"
          if [ ! -d "$HOME/cmake/cmake-3.18.1-Linux-x86_64" ]; then
            wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz -O "$HOME/cmake/cmake.tar.gz"
            tar -xzf "$HOME/cmake/cmake.tar.gz" -C "$HOME/cmake"
          fi
          echo "cmake.dir=$HOME/cmake/cmake-3.18.1-Linux-x86_64" >> android/local.properties

      - name: Generate temporary release signing key
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore android/app/anymex.jks \
            -storetype JKS \
            -storepass android-build-only \
            -keypass android-build-only \
            -alias anymex \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=AnymeX CI Build, OU=Android, O=AnymeX, L=CI, ST=CI, C=ID"
          cat > android/key.properties << 'EOF'
          storePassword=android-build-only
          keyPassword=android-build-only
          keyAlias=anymex
          storeFile=anymex.jks
          EOF

      - name: Create environment file
        env:
          AL_CLIENT_ID: ${{ secrets.AL_CLIENT_ID }}
          AL_CLIENT_SECRET: ${{ secrets.AL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          CALLBACK_SCHEME: ${{ secrets.CALLBACK_SCHEME }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          GIT_CLIENT_ID: ${{ secrets.GIT_CLIENT_ID }}
          GIT_CLIENT_SECRET: ${{ secrets.GIT_CLIENT_SECRET }}
          GIT_CALLBACK_SCHEME: ${{ secrets.GIT_CALLBACK_SCHEME }}
          COMMENTS_BASE_URL: ${{ secrets.COMMENTS_BASE_URL }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WATCHIUM_SERVER_URL: ${{ secrets.WATCHIUM_SERVER_URL }}
          WATCHIUM_API_TOKEN: ${{ secrets.WATCHIUM_API_TOKEN }}
        run: |
          cat > .env << EOF
          AL_CLIENT_ID=$AL_CLIENT_ID
          AL_CLIENT_SECRET=$AL_CLIENT_SECRET
          SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID
          SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET
          MAL_CLIENT_ID=$MAL_CLIENT_ID
          MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET
          CALLBACK_SCHEME=$CALLBACK_SCHEME
          GOOGLE_BOOKS_API_KEY=$GOOGLE_BOOKS_API_KEY
          GIT_CLIENT_ID=$GIT_CLIENT_ID
          GIT_CLIENT_SECRET=$GIT_CLIENT_SECRET
          GIT_CALLBACK_SCHEME=$GIT_CALLBACK_SCHEME
          COMMENTS_BASE_URL=$COMMENTS_BASE_URL
          BOT_BASE_URL=$BOT_BASE_URL
          BOT_API_SECRET=$BOT_API_SECRET
          TMDB_API_KEY=$TMDB_API_KEY
          WATCHIUM_SERVER_URL=$WATCHIUM_SERVER_URL
          WATCHIUM_API_TOKEN=$WATCHIUM_API_TOKEN
          EOF

      - name: Build APKs
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk AnymeX-Android-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk AnymeX-Android-arm64-v8a.apk
          mv app-x86_64-release.apk AnymeX-Android-x86_64.apk
          mv app-release.apk AnymeX-Android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnymeX-Android-APKs
          path: build/app/outputs/flutter-apk/AnymeX-Android-*.apk
          if-no-files-found: error
          retention-days: 14
